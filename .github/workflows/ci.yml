# Checks every push and pull request (GAP_ANALYSIS CD1). The deploy job runs on pushes to main and the preview
# job on pull requests (CD2 staging). Both skip, without failing, until the Cloudflare secrets are configured,
# and fork pull requests never get secrets, so their deploy and preview steps skip too.
name: CI

on:
  push:
  pull_request:

# Pull requests cancel superseded runs. Pushes to main never do: a cancelled deploy could stop halfway.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit, integration and contract tests
        run: npm test
      - name: Build the web app
        run: npm run build:web
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

  # GAP T1: the backend is done when this job passes.
  # Runs the API contract suite (packages/contract-tests) against the real Worker under `wrangler dev` (workerd),
  # fed by a local live imitation of the NOAA feeds (apps/worker/scripts/fixture-feeds.ts) instead of the internet.
  # The stream is real-time (a delta about once a minute), so the suite waits up to CONTRACT_WAIT_MS = 240 s: tests that need 3 deltas take about 3 min, plus a minute of headroom.
  # Test alerts are raised through POST /api/v1/admin/test-alert with the ADMIN_TOKEN passed below.
  contract-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start fixture NOAA feeds
        run: |
          mkdir -p logs
          nohup npx tsx apps/worker/scripts/fixture-feeds.ts --port 8788 > logs/fixture-feeds.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8788/json/rtsw/rtsw_mag_1m.json -o /dev/null && exit 0
            sleep 1
          done
          echo "fixture feeds did not start"; cat logs/fixture-feeds.log; exit 1
      - name: Start the Worker (wrangler dev)
        working-directory: apps/worker
        run: |
          nohup npx wrangler dev --port 8787 --ip 127.0.0.1 \
            --var FEED_BASE:http://127.0.0.1:8788 --var ADMIN_TOKEN:ci-token \
            > ../../logs/wrangler.log 2>&1 &
      - name: Wait for the Worker
        run: |
          for i in $(seq 1 90); do
            curl -sf http://127.0.0.1:8787/api/v1/health && exit 0
            sleep 1
          done
          echo "Worker did not become healthy within 90 s"; cat logs/wrangler.log; exit 1
      - name: Contract tests
        run: npm run test:contract
        env:
          CONTRACT_BASE_URL: http://127.0.0.1:8787
          CONTRACT_CONTROL: worker
          CONTRACT_ADMIN_TOKEN: ci-token
          CONTRACT_WAIT_MS: "240000"
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: contract-worker-logs
          path: logs/

  deploy:
    needs: [check, contract-worker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Check for Cloudflare secrets
        id: cf
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$HAS_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "CLOUDFLARE_API_TOKEN is not set; skipping deploy." >> "$GITHUB_STEP_SUMMARY"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v7
        if: steps.cf.outputs.enabled == 'true'
        with:
          node-version: 22
          cache: npm
      - name: Install
        if: steps.cf.outputs.enabled == 'true'
        run: npm ci
      - name: Deploy the Worker
        if: steps.cf.outputs.enabled == 'true'
        working-directory: apps/worker
        run: npx wrangler deploy
      - name: Build the web app
        if: steps.cf.outputs.enabled == 'true'
        run: npm run build:web
      - name: Deploy the web app to Pages
        if: steps.cf.outputs.enabled == 'true'
        # From apps/web so wrangler.jsonc there supplies the output dir and the API service binding.
        working-directory: apps/web
        run: npx wrangler pages deploy --branch main

  preview:
    needs: [check, contract-worker]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: deploy-staging-${{ github.head_ref }}
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Passed through the environment rather than interpolated, so a branch name cannot inject shell.
      BRANCH: ${{ github.head_ref }}
    steps:
      - uses: actions/checkout@v4
      - name: Check for Cloudflare secrets
        id: cf
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$HAS_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "CLOUDFLARE_API_TOKEN is not set (or this is a fork PR); skipping preview." >> "$GITHUB_STEP_SUMMARY"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v7
        if: steps.cf.outputs.enabled == 'true'
        with:
          node-version: 22
          cache: npm
      - name: Install
        if: steps.cf.outputs.enabled == 'true'
        run: npm ci
      - name: Deploy the staging Worker
        if: steps.cf.outputs.enabled == 'true'
        working-directory: apps/worker
        run: npx wrangler deploy --env staging
      - name: Build the web app
        if: steps.cf.outputs.enabled == 'true'
        run: npm run build:web
      - name: Deploy the web preview to Pages
        if: steps.cf.outputs.enabled == 'true'
        working-directory: apps/web
        run: npx wrangler pages deploy --branch "$BRANCH"
